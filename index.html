
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marhcski Paint</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="title-bar">
        <div id="quick-access">
            <!-- Quick Access Toolbar goes here -->
        </div>
        <h1>Marhcski Paint</h1>
    </header>

    <nav id="paint-menu">
        <!-- Paint menu and ribbon tabs go here -->
    </nav>

    <main id="workspace">
        <div id="ribbon">
            <!-- Drawing tools and color palette go here -->
        </div>

        <section id="canvas-area">
            <canvas id="paint-canvas" width="800" height="500"></canvas>
        </section>
    </main>

    <footer id="status-bar">
        <span id="canvas-size">800 × 500 px</span>
        <span id="zoom-level">100%</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
